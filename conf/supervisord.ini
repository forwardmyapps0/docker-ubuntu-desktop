[program:webvirtcloud]
; Unter Ubuntu ist gunicorn meist in /usr/local/bin oder /usr/bin zu finden
command=/usr/local/bin/gunicorn webvirtcloud.wsgi:application -c /opt/webvirtcloud/gunicorn.conf.py
directory=/opt/webvirtcloud
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/webvirtcloud.log

[program:novncd]
; Pfad zu python3 ist unter Ubuntu /usr/bin/python3
command=/usr/bin/python3 /opt/webvirtcloud/console/novncd
directory=/opt/webvirtcloud
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/novncd.log

[program:nginx]
; Nginx benötigt unter Ubuntu oft das Verzeichnis für PID-Dateien
command=/usr/sbin/nginx -g 'daemon off; master_process on;'
autostart=true
autorestart=true
startretries=5
numprocs=1
startsecs=0
process_name=%(program_name)s
stdout_logfile=/var/log/supervisor/nginx.log
